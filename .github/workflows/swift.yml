# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:

    runs-on: macos-15

    steps: 
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "26.3"

    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/cache@v5
      with:
        path: |
          AzooKeyCore/.build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-swift-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-swift-

    - name: Build
      # TODO: add KeyboardViews
      run: |
        swift build --package-path AzooKeyCore --target CustardKit
        swift build --package-path AzooKeyCore --target SwiftUIUtils
        swift build --package-path AzooKeyCore --target KeyboardThemes

    - name: Run CustardKit tests
      working-directory: AzooKeyCore
      run: |
        xcodebuild test \
          -scheme CustardKitTests \
          -destination 'platform=macOS'
